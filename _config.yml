# GitHub Pages (Jekyll) config. The landing page is index.html (generated by
# scripts/build_site.py); Markdown docs use _layouts/default.html.
title: Sentinel
description: A private, self-hosted, paper-first algorithmic trading system.
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
relative_links:
  enabled: true
  collections: false
exclude:
  - site/index.template.html
  - sentinel
  - tests
  - scripts
  - docker
  - config
  - notebooks
  - var
  - Makefile
  - pyproject.toml
  - "*.egg-info"
  - docs/performance.json
