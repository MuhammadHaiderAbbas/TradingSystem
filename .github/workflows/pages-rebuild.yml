name: Rebuild GitHub Pages

# Branch-based GitHub Pages builds are not triggered by pushes made with app/bot
# credentials. This asks GitHub to rebuild the site after every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
