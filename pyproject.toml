[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-trader"
version = "0.1.0"
description = "Sentinel: a private, self-hosted, paper-first algorithmic trading system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - private use" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "APScheduler>=3.10,<4",
  "psutil>=5.9",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
exchanges = ["ccxt>=4.2"]
stocks = ["alpaca-py>=0.20"]
ml = ["lightgbm>=4.3", "optuna>=3.6"]
keyring = ["keyring>=24"]
parquet = ["pyarrow>=15"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.4"]
all = [
  "ccxt>=4.2", "lightgbm>=4.3", "optuna>=3.6", "keyring>=24", "pyarrow>=15",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.entry-points."sentinel.strategies"]
# Third-party strategy plugins register here, e.g.:
# my_strategy = "my_package.my_module:MyStrategy"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]  # str+Enum kept for JSON/YAML friendliness
